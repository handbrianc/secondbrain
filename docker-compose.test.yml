# Test environment docker-compose configuration
name: secondbrain-test

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: secondbrain-qdrant-test
    hostname: qdrant
    ports:
      - "6334:6333"  # Different from dev port (6333)
    volumes:
      - qdrant_test_data:/qdrant/storage
    networks:
      - secondbrain-test-network

volumes:
  qdrant_test_data:
    driver: local

networks:
  secondbrain-test-network:
    driver: bridge
