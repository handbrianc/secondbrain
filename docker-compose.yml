services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: secondbrain-qdrant
    hostname: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - secondbrain-network

volumes:
  qdrant-data:

networks:
  secondbrain-network:
    driver: bridge
