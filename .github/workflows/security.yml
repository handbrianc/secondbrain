name: Security Gates

'on':
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep Authlib on the patched 1.7 line; 1.8 is incompatible with Safety 3.8.1's httpx2 transport.
          pip install -e ".[dev]" "httpx2==2.12.0" "authlib==1.7.2"

      # Guard against vacuous passes: scripts/security_scan.sh skips a stage
      # (exit 0) when its tool is missing, which is fine locally but must
      # never happen in CI. Fail early if any scanner is absent.
      - name: Verify security tooling is installed
        run: |
          command -v bandit
          command -v pip-audit
          command -v safety
          command -v pipdeptree
          command -v libyear

      - name: Bandit static analysis (fails on high severity)
        run: ./scripts/security_scan.sh bandit

      - name: pip-audit dependency vulnerabilities (PYSEC-2026-3740 documented ignore)
        run: ./scripts/security_scan.sh audit

      - name: Safety vulnerability check (.safety-policy.yml)
        run: ./scripts/security_scan.sh safety

      - name: pipdeptree dependency tree and conflict check (fails on conflicts)
        run: ./scripts/security_scan.sh pipdeptree

      # Libyear dependency freshness (informational): publishes totals and the
      # five oldest dependencies to the run summary so staleness is visible as
      # code and third-party libraries change. Not a gate by default;
      # scripts/libyear.sh accepts --fail-over N to enforce a threshold.
      - name: libyear dependency freshness
        run: ./scripts/libyear.sh all

      - name: Publish libyear summary
        if: always()
        run: |
          {
            echo "### Libyear dependency freshness"
            echo ""
            for report in libyear.json libyear-locked.json; do
              if [ -f "$report" ]; then
                echo "**$report** — total libyears behind: \`$(jq -r '.total_libyears_behind' "$report")\`"
                echo ""
                echo "| library | current | latest | libyears |"
                echo "| ------- | ------- | ------ | -------- |"
                jq -r '.libraries | sort_by(.libyears_behind | tonumber) | reverse | .[0:5][] | "| \(.library) | \(.current_version) | \(.latest_version) | \(.libyears_behind) |"' "$report"
                echo ""
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
