name: Test Quality Gates

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy static analysis
        run: mypy .

  test-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (fast path)
        run: |
          pytest -m "unit" -v --tb=short

      - name: Run integration tests (mocked end-to-end)
        run: |
          pytest -m "integration" -v --tb=short

      - name: Coverage gate (full suite)
        run: |
          pytest -q \
            --cov=secondbrain \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=88

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  flaky-test-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run stability suites with retry tracking
        run: |
          set -o pipefail
          pytest tests/test_concurrency tests/test_chaos \
            --reruns=3 --reruns-delay=1 -q --tb=short 2>&1 | tee pytest-flaky.log

      - name: Fail on any rerun (flaky test detected)
        run: |
          if grep -qE ", [1-9][0-9]* rerun" pytest-flaky.log; then
            echo "::error::Flaky test detected: at least one test failed before passing on retry."
            grep -E ", [1-9][0-9]* rerun" pytest-flaky.log
            exit 1
          fi
          echo "No reruns: all stability tests passed on first attempt."

  performance-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run performance monitoring tests
        run: |
          pytest -m "performance" -v --tb=short
