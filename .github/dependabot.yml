# Dependabot configuration for automated dependency updates
# See: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Limit major version updates but don't ignore them completely
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sentence-transformers"
        update-types: ["version-update:semver-major"]
    # Groups mirror pyproject.toml [project] dependencies, grouped by role so
    # minor/patch bumps arrive as small, reviewable PRs. Stale entries
    # (pymongo, motor, python-dotenv, sentence-transformers, torch) that are
    # not declared in pyproject.toml were removed and anthropic was added
    # (2026-10-22 spec-verification audit).
    groups:
      cli-and-display:
        patterns:
          - "click"
          - "rich"
      document-processing:
        patterns:
          - "docling"
          - "docling-core"
          - "docling-parse"
      data-and-validation:
        patterns:
          - "pydantic"
          - "pydantic-settings"
          - "typing_extensions"
          - "numpy"
      storage-and-http:
        patterns:
          - "qdrant-client"
          - "httpx"
      llm-providers:
        patterns:
          - "openai"
          - "anthropic"
      telemetry:
        patterns:
          - "opentelemetry-api"
          - "opentelemetry-sdk"
      macos-platform:
        patterns:
          - "pyobjc*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
